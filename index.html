<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>After - 강남 대기업 직장인 데이팅</title>
<script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=29b2c40433b3928450db406728cf3ae5&libraries=services"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#fff;color:#111;-webkit-touch-callout:none;user-select:none}
  .hidden{display:none!important}
  .container{max-width:480px;margin:0 auto;padding:20px;min-height:100vh}
  .btn{width:100%;padding:16px;border-radius:14px;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
  .btn-kakao{background:#FEE500;color:#111}
  .btn-primary{background:#111;color:#fff}
  .btn-outline{background:#fff;color:#111;border:1px solid #ddd}
  .btn-danger{background:#fff;color:#e11d48;border:1px solid #fda4af}
  .btn:disabled{opacity:.5}
  .input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-top:10px;font-size:15px}
  .card{border:1px solid #eee;border-radius:16px;padding:16px;margin-top:14px}
  .badge{display:inline-block;background:#ecfdf5;color:#047857;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .place-item{display:flex;justify-content:space-between;align-items:center;border:1px solid #eee;border-radius:12px;padding:12px;margin-top:10px}
  .photo{width:100%;border-radius:14px;position:relative;overflow:hidden}
  .photo img{width:100%;display:block}
  .watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);font-weight:800;pointer-events:none;transform:rotate(-20deg);font-size:18px}
  #map{width:100%;height:280px;border-radius:14px;margin-top:12px;background:#f3f4f6}
  .small{font-size:13px;color:#666;margin-top:8px;line-height:1.5}
  .man-card{border:1px solid #eee;border-radius:16px;padding:14px;margin-top:12px}
</style>
</head>
<body oncontextmenu="return false">

<div id="screen-login" class="container">
  <h1 style="font-size:32px;margin-top:60px">After</h1>
  <p style="margin-top:10px;color:#555;line-height:1.5">강남 대기업 직장인만.<br>여자가 선택하고, 여자가 장소를 정하는 데이팅.</p>
  <button class="btn btn-kakao" onclick="startKakao()">카카오로 시작하기</button>
  <p class="small">누르면 바로 카카오 로그인으로 넘어가요. 온보딩 없음!</p>
  <div style="margin-top:20px">
    <label><input type="radio" name="gender" value="female" checked> 여자</label>
    <label style="margin-left:16px"><input type="radio" name="gender" value="male"> 남자</label>
  </div>
</div>

<div id="screen-verify" class="container hidden">
  <h2>회사 인증</h2>
  <p class="small">지금은 강남 대기업 직장인만 가입할 수 있어요. 회사 이메일로 인증해요.</p>
  <input id="companyEmail" class="input" placeholder="예: minji@samsung.com">
  <button class="btn btn-primary" onclick="sendCompanyCode()">인증번호 보내기</button>
  <input id="companyCode" class="input" placeholder="인증번호 6자리">
  <button class="btn btn-outline" onclick="checkCompanyCode()">인증
